name: Update official prices
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'templates/**', 'assets/**', '.ilang/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: official-price-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic pipeline
        run: python -m unittest discover -s tests -v
      - name: Fetch official public prices
        run: python scraper.py
      - name: Build and verify
        run: |
          python build.py
          python verify.py
      - name: Commit price observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json data/build-report.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: refresh official source observations'
            git push
          fi
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-site
          path: site/
          retention-days: 7
